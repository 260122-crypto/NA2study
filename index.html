<style>
:root{--paper:#f3f5f2;--white:#fff;--ink:#192d33;--muted:#687779;--green:#087a61;--navy:#103b37;--accent:#a8e5c8;--border:#dce4df;--red:#b83d46;--amber:#946200;--shadow:0 8px 24px #173b3210}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:8px;padding:10px 14px;background:#fff;color:var(--ink);min-height:42px}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.dark{background:var(--navy);color:#fff;border-color:var(--navy)}button.danger{color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--green)}header{background:var(--navy);color:#fff;padding:24px max(20px,calc((100vw - 1200px)/2)) 18px}header .eyebrow{font-size:12px;letter-spacing:.12em;color:#a8e5c8}h1{font-size:clamp(24px,4vw,34px);margin:4px 0}header p{margin:0;color:#d4e5df}.wrap{max-width:1200px;margin:auto;padding:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar .spacer{flex:1}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.metric{font-size:30px;font-weight:750;letter-spacing:-.03em}.muted{color:var(--muted)}.small{font-size:13px}.section-title{font-size:21px;margin:0 0 12px}.card h3{margin:0 0 8px;font-size:17px}.bar{height:9px;background:#e7ede9;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);width:0;transition:width .2s}.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:#eaf5ef;color:var(--green);margin:2px}.tag.red{background:#fff0f0;color:var(--red)}.tag.amber{background:#fff6df;color:var(--amber)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.item{border:1px solid var(--border);border-radius:9px;padding:13px;margin:9px 0;background:#fff}.item p{margin:5px 0}.item.done{border-left:4px solid var(--green)}label{display:block;font-weight:600;margin:10px 0 5px}input[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd7d0;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:85px;resize:vertical}.option{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--border);border-radius:8px;margin:7px 0;font-weight:400}.option input{margin-top:6px}.feedback{padding:12px;border-radius:8px;margin-top:12px}.feedback.good{background:#eaf5ef;border:1px solid #b6dfc8}.feedback.bad{background:#fff0f0;border:1px solid #efc3c5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:top}th{background:#f6f8f6}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px}.chart{height:190px;display:flex;align-items:flex-end;gap:10px;padding:12px 4px 0;border-bottom:1px solid var(--border)}.chart-col{flex:1;min-width:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}.chart-col .barv{width:min(34px,80%);min-height:2px;background:var(--green);border-radius:5px 5px 0 0}.chart-col small{font-size:11px;color:var(--muted);white-space:nowrap}.chart-col b{font-size:11px}.footer{padding:24px 0;color:var(--muted);font-size:12px}.hidden{display:none!important}.pill{border-radius:99px}.notice{background:#fff8e5;border:1px solid #ead8a5;padding:12px;border-radius:8px;font-size:13px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.span-3,.span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}.filters,.split{grid-template-columns:1fr}.wrap{padding:14px}header{padding:20px 16px}.metric{font-size:26px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><header><div class="eyebrow">NETWORK MANAGER LEVEL 2 · PERSONAL LEARNING</div><h1>NA2 Study 학습 관리실</h1><p>이론 · 필기 · 실기 · 오답노트 · 학습 성과 분석</p></header>
<div class="wrap"><div class="toolbar"><nav class="nav" id="nav"></nav><span class="spacer"></span><button id="exportBtn">기록 내보내기</button><button id="importBtn">기록 가져오기</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div><main id="app"></main><div class="footer">개인 브라우저에 저장되는 학습 도구입니다. 이 페이지의 데모 문항은 저장소의 공식 기출문제 전체가 아닙니다. 기기·브라우저가 바뀌면 기록 내보내기/가져오기를 이용하세요.</div></div>
<script>
const KEY='na2_study_personal_tracker_v1';
const initialQuestions=[
{id:'w1',area:'필기',topic:'네트워크 기초',type:'선택형',q:'OSI 참조 모델에서 라우팅 기능과 가장 밀접한 계층은?',options:['물리 계층','데이터 링크 계층','네트워크 계층','전송 계층'],answer:2,explain:'네트워크 계층은 논리 주소와 경로 선택(라우팅)을 담당합니다.'},
{id:'w2',area:'필기',topic:'IPv4 서브넷',type:'선택형',q:'서브넷 마스크 255.255.255.224에서 호스트 비트 수와 일반적인 사용 가능 호스트 수는?',options:['3비트, 6개','5비트, 30개','6비트, 62개','8비트, 254개'],answer:1,explain:'/27이므로 호스트 비트는 32-27=5비트입니다. 2⁵-2=30개입니다.'},
{id:'w3',area:'필기',topic:'전송 계층',type:'선택형',q:'연결 지향형이며 신뢰성 있는 전송을 제공하는 프로토콜은?',options:['UDP','IP','ARP','TCP'],answer:3,explain:'TCP는 연결 설정, 순서 제어, 재전송 등을 통해 신뢰성 있는 바이트 스트림을 제공합니다.'},
{id:'w4',area:'필기',topic:'주소 변환',type:'선택형',q:'같은 로컬 네트워크에서 IPv4 주소에 대응하는 MAC 주소를 알아낼 때 사용하는 프로토콜은?',options:['DNS','ARP','DHCP','ICMP'],answer:1,explain:'ARP는 로컬 링크에서 IPv4 주소에 대응하는 링크 계층 주소를 알아내는 데 사용됩니다.'},
{id:'p1',area:'실기',topic:'IPv4 설정',type:'단답형',q:'IPv4 주소와 서브넷 마스크를 바탕으로 다른 네트워크로 나가는 패킷을 전달하는 장치의 주소를 무엇이라고 하는가?',answerText:['기본 게이트웨이','default gateway','게이트웨이'],explain:'기본 게이트웨이는 목적지가 로컬 서브넷 밖에 있을 때 패킷을 전달할 다음 홉입니다.'},
{id:'p2',area:'실기',topic:'라우터 기초',type:'선택형',q:'Cisco IOS에서 현재 설정을 시작 설정으로 저장할 때 일반적으로 사용하는 명령은?',options:['show running-config','copy running-config startup-config','reload','enable secret'],answer:1,explain:'running-config를 startup-config로 복사하면 설정을 시작 설정으로 저장합니다.'},
{id:'p3',area:'실기',topic:'케이블링',type:'선택형',q:'UTP 케이블의 핀 배열을 연습할 때 가장 중요한 확인 방법은?',options:['케이블 색만 외운다','양쪽 커넥터의 관찰 방향과 핀 번호 기준을 통일한다','케이블 길이만 측정한다','링크 LED만 보고 핀 배열을 단정한다'],answer:1,explain:'커넥터를 보는 방향이 바뀌면 좌우가 뒤집혀 보일 수 있으므로 관찰 방향과 핀 번호 기준을 먼저 통일합니다.'}
];
const theorySeed=[
{ id:'t1',topic:'네트워크 기본 개념',desc:'네트워크의 목적, LAN/WAN, 토폴로지, 장치의 역할을 설명할 수 있는지 확인합니다.',check:['네트워크와 인터넷의 차이를 설명한다','스위치·라우터·모뎀의 역할을 구분한다']},
{ id:'t2',topic:'OSI 7계층과 TCP/IP',desc:'각 계층의 역할, 대표 프로토콜, PDU와 주소 종류를 연결합니다.',check:['계층별 주요 기능을 설명한다','MAC·IP·포트 번호의 차이를 구분한다']},
{ id:'t3',topic:'IPv4 주소와 서브넷팅',desc:'CIDR, 서브넷 마스크, 네트워크 ID, 브로드캐스트, 호스트 범위를 계산합니다.',check:['변하는 옥텟과 블록 크기를 찾는다','네트워크·브로드캐스트·호스트 범위를 계산한다']},
{ id:'t4',topic:'주요 프로토콜',desc:'ARP, DNS, DHCP, ICMP, TCP, UDP의 목적과 동작을 비교합니다.',check:['프로토콜 이름과 기능을 연결한다','TCP와 UDP의 차이를 설명한다']},
{ id:'t5',topic:'라우팅과 기본 게이트웨이',desc:'라우팅 테이블, 다음 홉, 정적 경로와 기본 경로를 학습합니다.',check:['로컬/원격 목적지를 구분한다','기본 게이트웨이의 역할을 설명한다']},
{ id:'t6',topic:'케이블링 및 장비 설정',desc:'UTP 핀 배열, 인터페이스, 관리 접근, 설정 저장과 검증을 연습합니다.',check:['커넥터 관찰 방향과 핀 번호를 확인한다','설정 후 show 명령으로 결과를 검증한다']}
];
const practicalSeed=[
{id:'lab1',title:'Windows IPv4 설정',kind:'실습형',desc:'IPv4 주소·서브넷 마스크·기본 게이트웨이·DNS 설정을 확인합니다.',steps:['현재 IP 설정을 확인한다','요구 조건에 맞춰 주소 정보를 입력한다','설정값을 다시 확인하고 통신을 점검한다']},
{id:'lab2',title:'DHCP와 DNS 확인',kind:'실습형',desc:'자동 주소 할당과 이름 해석의 설정 요소를 점검합니다.',steps:['DHCP 범위와 임대 설정을 확인한다','DNS 레코드 종류와 값의 의미를 확인한다','클라이언트에서 결과를 재확인한다']},
{id:'lab3',title:'라우터 인터페이스 설정',kind:'실습형',desc:'인터페이스 주소와 활성 상태를 설정하고 검증합니다.',steps:['올바른 모드에서 인터페이스를 선택한다','IP 주소와 서브넷 마스크를 설정한다','인터페이스 상태와 주소를 확인한다']},
{id:'lab4',title:'정적 경로와 설정 저장',kind:'실습형',desc:'목적지 네트워크·마스크·다음 홉을 확인하고 설정을 저장합니다.',steps:['목적지와 다음 홉을 계산한다','정적 경로 명령을 입력한다','라우팅 테이블을 확인하고 설정을 저장한다']},
{id:'lab5',title:'케이블링 핀 배열',kind:'작업형',desc:'커넥터의 관찰 방향을 통일하고 핀 번호와 색상 배열을 확인합니다.',steps:['커넥터의 접점과 클립 방향을 확인한다','핀 1~8의 배열을 순서대로 점검한다','양쪽 배열과 케이블 유형을 비교한다']}
];
function fresh(){return {version:1,createdAt:new Date().toISOString(),theory:{},labs:{},questions:initialQuestions.map(x=>({...x})),attempts:[],bookmarks:[],activeTab:'dashboard',notes:{}}}
function load(){try{const s=localStorage.getItem(KEY);if(!s)return fresh();const d=JSON.parse(s);if(!d||d.version!==1||!Array.isArray(d.questions)||!Array.isArray(d.attempts))throw Error('형식이 올바르지 않습니다');return {...fresh(),...d}}catch(e){return {...fresh(),storageWarning:'기존 기록을 읽지 못했습니다. 원본을 덮어쓰지 않도록 자동 저장을 중단했습니다.'}}}
let state=load(),saveEnabled=!state.storageWarning;
function save(){if(!saveEnabled)return;try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='자동 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){saveEnabled=false;alert('브라우저 저장 공간에 기록하지 못했습니다. 기록 내보내기로 백업하세요. 현재 화면의 데이터는 유지됩니다.');}}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function attempts(area){return state.attempts.filter(a=>!area||a.area===area)}function accuracy(list){return list.length?Math.round(list.filter(a=>a.correct).length/list.length*100):0}function latestWrong(){const m=new Map();state.attempts.forEach(a=>m.set(a.qid,a));return [...m.values()].filter(a=>!a.correct)}function getQ(id){return state.questions.find(q=>q.id===id)}
const tabs=[['dashboard','대시보드'],['theory','이론'],['written','필기'],['practical','실기'],['wrong','오답노트'],['analytics','성적 분석'],['manage','문항 관리']];
function nav(){ $('#nav').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="${state.activeTab===id?'active':''}">${label}${id==='wrong'&&latestWrong().length?` (${latestWrong().length})`:''}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;render()})}
function metric(label,value,sub){return `<div class="card span-3"><div class="muted small">${label}</div><div class="metric">${value}</div><div class="muted small">${sub||''}</div></div>`}
function dashboard(){const all=attempts(),wa=attempts('필기'),pa=attempts('실기'),th=theorySeed.filter(t=>state.theory[t.id]?.done).length,labDone=practicalSeed.filter(t=>state.labs[t.id]?.done).length;return `<div class="grid">${metric('누적 제출',all.length+'회','채점된 문제 시도 수')}${metric('전체 정답률',accuracy(all)+'%',all.length?'누적 시도 기준':'문제를 풀면 분석이 시작됩니다')}${metric('해결되지 않은 오답',latestWrong().length+'개','가장 최근 제출이 오답인 문항')}${metric('이론 진도',Math.round(th/theorySeed.length*100)+'%',`${th}/${theorySeed.length}개 주제 완료`)}<div class="card span-8"><h2 class="section-title">최근 점수 추이</h2>${scoreChart(all)}</div><div class="card span-4"><h2 class="section-title">영역별 현황</h2>${[['필기',wa],['실기',pa]].map(([name,list])=>`<div class="item"><div class="between"><b>${name}</b><b>${accuracy(list)}%</b></div><div class="bar"><span style="width:${accuracy(list)}%"></span></div><div class="muted small">${list.length}회 제출 · ${list.filter(a=>a.correct).length}회 정답</div></div>`).join('')}<div class="item"><div class="between"><b>실기 체크리스트</b><b>${Math.round(labDone/practicalSeed.length*100)}%</b></div><div class="bar"><span style="width:${labDone/practicalSeed.length*100}%"></span></div><div class="muted small">${labDone}/${practicalSeed.length}개 과제 완료</div></div></div><div class="card span-6"><h2 class="section-title">지금 추천하는 학습</h2>${latestWrong().length?`<p>최근 제출 기준 오답이 <b>${latestWrong().length}개</b> 있습니다. 오답노트에서 다시 풀어보세요.</p><button class="primary" onclick="go('wrong')">오답 복습 시작</button>`:`<p>현재 해결되지 않은 오답이 없습니다. 필기 또는 실기 문제를 풀어 학습 기록을 쌓아보세요.</p><button class="primary" onclick="go('written')">필기 문제 풀기</button>`}</div><div class="card span-6"><h2 class="section-title">기록 상태</h2><p id="saveStatus" class="muted">${saveEnabled?'브라우저 로컬 저장소 사용 중':'자동 저장 중단'}</p><p class="small muted">이 기록은 현재 브라우저에 저장됩니다. 중요한 기록은 정기적으로 JSON 파일로 내보내세요.</p><button onclick="exportData()">백업 파일 만들기</button></div></div>`}
function scoreChart(list){const scores=[];for(let i=0;i<list.length;i+=1){const batch=list.slice(Math.max(0,i-9),i+1);scores.push({score:accuracy(batch),label:i+1})}const shown=scores.slice(-10);if(!shown.length)return '<div class="empty">아직 점수가 없습니다. 문제를 제출하면 최근 10회 기준 정답률이 표시됩니다.</div>';return `<div class="chart">${shown.map(s=>`<div class="chart-col"><b>${s.score}%</b><div class="barv" style="height:${Math.max(2,s.score)}%" title="최근 누적 정답률 ${s.score}%"></div><small>${s.label}회</small></div>`).join('')}</div><p class="muted small">각 막대는 해당 제출 시점까지의 최근 최대 10회 정답률입니다. 단순 점수 나열이 아니라 이동 구간의 변화를 보여줍니다.</p>`}
function theory(){return `<h2 class="section-title">이론 학습 목록</h2><p class="muted">주제별 체크리스트를 완료하면 이론 진도에 반영됩니다. 세부 이론은 기존 학습센터와 연결해 확인하세요.</p><div class="grid">${theorySeed.map(t=>{const v=state.theory[t.id]||{checks:[]};return `<div class="card span-6"><div class="between"><h3>${esc(t.topic)}</h3><span class="tag">${v.done?'완료':'학습 중'}</span></div><p>${esc(t.desc)}</p>${t.check.map((c,i)=>`<label class="option"><input type="checkbox" data-theory="${t.id}" data-check="${i}" ${v.checks?.includes(i)?'checked':''}> <span>${esc(c)}</span></label>`).join('')}<div class="row"><button class="${v.done?'':'primary'}" onclick="toggleTheory('${t.id}')">${v.done?'완료 취소':'주제 학습 완료'}</button><button onclick="openRepo()">기존 학습센터 열기 ↗</button></div></div>`}).join('')}</div>`}
function questions(area,onlyWrong=false){let qs=state.questions.filter(q=>q.area===area);if(onlyWrong){const ids=new Set(latestWrong().map(a=>a.qid));qs=qs.filter(q=>ids.has(q.id))}if(!qs.length)return `<div class="empty">표시할 문항이 없습니다. 문항 관리에서 직접 추가하거나 JSON으로 가져오세요.</div>`;return `<div class="filters"><input id="qsearch" type="text" placeholder="문제·주제 검색"><select id="topicfilter"><option value="">모든 주제</option>${[...new Set(qs.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><select id="typefilter"><option value="">모든 유형</option>${[...new Set(qs.map(q=>q.type))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div id="questionList">${qs.map(q=>questionCard(q)).join('')}</div>`}
function questionCard(q){const last=[...state.attempts].reverse().find(a=>a.qid===q.id);const bookmarked=state.bookmarks.includes(q.id);return `<section class="card" style="margin-top:14px" id="card-${q.id}" data-qcard data-topic="${esc(q.topic)}" data-type="${esc(q.type)}" data-search="${esc(q.q+' '+q.topic)}"><div class="between"><div><span class="tag">${esc(q.area)}</span><span class="tag">${esc(q.topic)}</span><span class="tag">${esc(q.type)}</span></div><button onclick="bookmark('${q.id}')">${bookmarked?'★ 북마크됨':'☆ 북마크'}</button></div><h3>${esc(q.q)}</h3><form onsubmit="submitAnswer(event,'${q.id}')">${q.type==='단답형'?`<label for="ans-${q.id}">답안 입력</label><input id="ans-${q.id}" name="answer" type="text" autocomplete="off" placeholder="정답을 입력하세요">`:q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" required> <span>${esc(o)}</span></label>`).join('')}<div class="row" style="margin-top:12px"><button class="primary" type="submit">답안 제출 및 채점</button><button type="button" onclick="showExplanation('${q.id}')">해설 보기</button></div></form><div id="feedback-${q.id}"></div>${last?`<p class="muted small">최근 기록: ${last.correct?'정답':'오답'} · ${new Date(last.at).toLocaleString('ko-KR')}</p>`:''}</section>`}
function practical(){return `<h2 class="section-title">실기 3영역</h2><p class="muted">기존 저장소의 분류를 따라 작업형·실습형·단답형/객관식으로 정리합니다. 아래 체크리스트는 학습용 기록이며 실제 장비를 대신 채점하지 않습니다.</p><div class="grid"><div class="card span-4"><h3>작업형 · 케이블링</h3><p>핀 배열과 커넥터 관찰 방향을 확인합니다.</p><button class="primary" onclick="openRepo('#/cabling')">기존 케이블링 연습 열기 ↗</button></div><div class="card span-4"><h3>실습형 · Windows/라우터</h3><p>설정 절차와 확인 과정을 체크합니다.</p><button onclick="document.getElementById('lablist').scrollIntoView({behavior:'smooth'})">실습 체크리스트 보기</button></div><div class="card span-4"><h3>단답형/객관식</h3><p>문항을 풀고 채점·해설·오답 기록을 남깁니다.</p><button class="primary" onclick="go('practicalQuestions')">실기 문제풀이</button></div><div class="card span-12" id="lablist"><h2 class="section-title">실습 과제 기록</h2>${practicalSeed.map(t=>{const v=state.labs[t.id]||{};return `<div class="item"><div class="between"><div><b>${esc(t.title)}</b> <span class="tag">${esc(t.kind)}</span></div><label style="margin:0;font-weight:400"><input type="checkbox" ${v.done?'checked':''} onchange="toggleLab('${t.id}',this.checked)"> 완료</label></div><p>${esc(t.desc)}</p><details><summary>절차 및 개인 메모</summary><ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><textarea placeholder="입력값, 확인 결과, 틀린 부분 메모" onchange="saveLabNote('${t.id}',this.value)">${esc(v.note||'')}</textarea></details></div>`}).join('')}</div></div>`}
function wrong(){const ws=latestWrong();if(!ws.length)return `<h2 class="section-title">오답노트</h2><div class="empty">현재 최근 제출 기준으로 해결되지 않은 오답이 없습니다. 문제를 틀리면 이곳에 자동으로 모입니다.</div>`;return `<h2 class="section-title">오답노트 <span class="tag red">${ws.length}개</span></h2><p class="muted">문항의 가장 최근 제출이 오답인 경우 표시합니다. 재풀이에서 정답을 맞히면 오답 목록에서 사라지지만 이전 시도는 성적 기록에 남습니다.</p>${ws.map(a=>{const q=getQ(a.qid);return q?`<div class="card" style="margin-bottom:12px"><div class="between"><div><span class="tag red">${esc(a.area)} 오답</span><span class="tag">${esc(q.topic)}</span></div><button class="primary" onclick="go('${a.area==='필기'?'written':'practicalQuestions'}','${q.id}')">다시 풀기</button></div><h3>${esc(q.q)}</h3><p><b>내 답안:</b> ${esc(a.userAnswer||'(미응답)')}</p><p><b>정답:</b> ${esc(answerText(q))}</p><p class="muted">${esc(q.explain||'등록된 해설이 없습니다.')}</p></div>`:''}).join('')}`}
function answerText(q){return q.type==='단답형'?(q.answerText||[]).join(' / '):(q.options?.[q.answer]??'')}
function analytics(){const all=attempts(),wa=attempts('필기'),pa=attempts('실기'),topics=[...new Set(state.questions.map(q=>q.topic))].map(topic=>{const ids=state.questions.filter(q=>q.topic===topic).map(q=>q.id);const aa=all.filter(a=>ids.includes(a.qid));return {topic,aa,rate:accuracy(aa)}}).sort((a,b)=>a.rate-b.rate);return `<h2 class="section-title">성적 및 학습률 분석</h2><div class="grid">${metric('누적 정답률',accuracy(all)+'%',`${all.filter(a=>a.correct).length}/${all.length} 정답 시도`)}${metric('필기 정답률',accuracy(wa)+'%',`${wa.length}회 제출`)}${metric('실기 정답률',accuracy(pa)+'%',`${pa.length}회 제출`)}${metric('오답 해결률',(()=>{const wrongIds=new Set(state.attempts.filter(a=>!a.correct).map(a=>a.qid));const solved=[...wrongIds].filter(id=>{const aa=state.attempts.filter(a=>a.qid===id);return aa.length&&aa[aa.length-1].correct}).length;return wrongIds.size?Math.round(solved/wrongIds.size*100):0})()+'%','한 번이라도 틀린 문항 중 최근 정답인 비율')}<div class="card span-7"><h3>최근 점수 변화</h3>${scoreChart(all)}</div><div class="card span-5"><h3>주제별 취약점</h3>${topics.length?topics.map(t=>`<div class="item"><div class="between"><b>${esc(t.topic)}</b><b>${t.aa.length?t.rate+'%':'기록 없음'}</b></div><div class="bar"><span style="width:${t.aa.length?t.rate:0}%"></span></div><div class="muted small">${t.aa.length}회 시도</div></div>`).join(''):'<div class="empty">문항을 풀면 주제별 분석이 표시됩니다.</div>'}</div><div class="card span-12"><h3>제출 이력</h3>${all.length?`<div class="table-wrap"><table><thead><tr><th>일시</th><th>영역</th><th>주제</th><th>결과</th><th>내 답안</th></tr></thead><tbody>${[...all].reverse().slice(0,100).map(a=>`<tr><td>${new Date(a.at).toLocaleString('ko-KR')}</td><td>${esc(a.area)}</td><td>${esc(getQ(a.qid)?.topic||'삭제된 문항')}</td><td><span class="tag ${a.correct?'':'red'}">${a.correct?'정답':'오답'}</span></td><td>${esc(a.userAnswer||'(미응답)')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">아직 제출 기록이 없습니다.</div>'}</div></div>`}
function manage(){return `<h2 class="section-title">문항 관리</h2><p class="muted">직접 만든 문제를 추가하거나 JSON 파일로 문제은행을 가져올 수 있습니다. 기존 저장소의 문제를 자동으로 가져오지는 않습니다.</p><div class="grid"><div class="card span-6"><h3>새 문항 추가</h3><form id="addQForm"><label>영역</label><select name="area"><option>필기</option><option>실기</option></select><label>주제</label><input name="topic" required placeholder="예: IPv4 서브넷"><label>유형</label><select name="type"><option>선택형</option><option>단답형</option></select><label>문제</label><textarea name="q" required></textarea><div id="choiceFields"><label>선택지 (한 줄에 하나씩, 정답 번호는 1부터)</label><textarea name="options" placeholder="선택지 1&#10;선택지 2&#10;선택지 3&#10;선택지 4"></textarea><label>정답 번호</label><input name="answer" type="number" min="1" value="1"></div><div id="shortFields" class="hidden"><label>허용 정답 (쉼표로 구분)</label><input name="answerText" placeholder="예: 기본 게이트웨이, default gateway"></div><label>해설</label><textarea name="explain"></textarea><button class="primary" type="submit">문항 저장</button></form></div><div class="card span-6"><h3>문항은행 파일 형식</h3><p>JSON은 문항 배열 또는 <code>{"questions":[...]}</code> 형태를 지원합니다.</p><pre style="white-space:pre-wrap;background:#f6f8f6;padding:12px;border-radius:8px;font-size:12px">[{"id":"custom-1","area":"필기","topic":"네트워크 기초","type":"선택형","q":"문제 내용","options":["A","B","C","D"],"answer":2,"explain":"해설"}]</pre><p class="small muted">선택형 answer는 0부터 시작하는 배열 인덱스입니다. 문항 ID가 겹치면 새 ID로 변경됩니다. 가져오기는 기존 문항을 지우지 않고 합칩니다.</p><button onclick="downloadTemplate()">문항 템플릿 다운로드</button></div><div class="card span-12"><div class="between"><h3>등록된 문항 (${state.questions.length})</h3><button class="danger" onclick="resetAttempts()">학습 기록만 초기화</button></div><div class="table-wrap"><table><thead><tr><th>영역</th><th>주제</th><th>유형</th><th>문제</th><th>작업</th></tr></thead><tbody>${state.questions.map(q=>`<tr><td>${esc(q.area)}</td><td>${esc(q.topic)}</td><td>${esc(q.type)}</td><td>${esc(q.q)}</td><td><button class="danger" onclick="deleteQuestion('${q.id}')">삭제</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function go(tab,focusId){state.activeTab=tab;render();if(focusId)setTimeout(()=>{const el=document.getElementById('card-'+focusId);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},30)}window.go=go;
function render(){nav();const a=$('#app');if(state.storageWarning)a.innerHTML=`<div class="notice">${esc(state.storageWarning)} 현재 화면의 기록을 내보낸 뒤 가져오기 기능으로 복구를 시도하세요. 자동 저장은 중단되어 있습니다.</div>`;const views={dashboard:dashboard,theory:theory,written:()=>`<h2 class="section-title">필기 문제풀이</h2><p class="muted">문항별 제출 결과가 자동 기록됩니다. 정답을 확인하기 전에는 해설이 숨겨져 있습니다.</p>${questions('필기')}`,practical:practical,wrong:wrong,analytics:analytics,manage:manage};if(state.activeTab==='practicalQuestions'){a.innerHTML=`<div class="between"><h2 class="section-title">실기 단답형/객관식 문제풀이</h2><button onclick="go('practical')">실기 홈</button></div>${questions('실기')}`}else a.innerHTML=(views[state.activeTab]||dashboard)();bindView();}
function bindView(){document.querySelectorAll('[data-theory]').forEach(el=>el.onchange=()=>{const id=el.dataset.theory,i=+el.dataset.check;state.theory[id]??={checks:[],done:false};const c=new Set(state.theory[id].checks||[]);el.checked?c.add(i):c.delete(i);state.theory[id].checks=[...c];save()});const form=$('#addQForm');if(form){form.elements.type.onchange=()=>{const short=form.elements.type.value==='단답형';$('#choiceFields').classList.toggle('hidden',short);$('#shortFields').classList.toggle('hidden',!short)};form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),type=f.get('type'),id='q-'+Date.now();let q={id,area:f.get('area'),topic:f.get('topic').trim(),type,q:f.get('q').trim(),explain:f.get('explain').trim()};if(type==='단답형')q.answerText=f.get('answerText').split(',').map(x=>x.trim()).filter(Boolean);else{q.options=f.get('options').split('\n').map(x=>x.trim()).filter(Boolean);q.answer=Number(f.get('answer'))-1;if(q.options.length<2||q.answer<0||q.answer>=q.options.length){alert('선택지를 2개 이상 입력하고 정답 번호를 확인하세요.');return}}state.questions.push(q);save();render();alert('문항을 추가했습니다.')};}const qs=$('#qsearch');if(qs)qs.oninput=filterQuestions;const tf=$('#topicfilter');if(tf)tf.onchange=filterQuestions;const yf=$('#typefilter');if(yf)yf.onchange=filterQuestions;}
function filterQuestions(){const s=($('#qsearch')?.value||'').toLowerCase(),t=$('#topicfilter')?.value||'',y=$('#typefilter')?.value||'';document.querySelectorAll('[data-qcard]').forEach(el=>el.classList.toggle('hidden',!(el.dataset.search.toLowerCase().includes(s)&&(!t||el.dataset.topic===t)&&(!y||el.dataset.type===y))))}
function submitAnswer(e,id){e.preventDefault();const q=getQ(id);if(!q)return;const form=e.currentTarget;let ua,correct;if(q.type==='단답형'){ua=form.elements.answer.value.trim();const norm=s=>s.toLowerCase().replace(/[\s\-_.]/g,'');correct=!!ua&&(q.answerText||[]).some(a=>norm(a)===norm(ua));}else{const v=form.querySelector('input[name="answer"]:checked');if(!v){alert('답안을 선택하세요.');return}ua=q.options[+v.value];correct=+v.value===q.answer;}const attempt={qid:q.id,area:q.area,topic:q.topic,userAnswer:ua,correct,at:new Date().toISOString()};state.attempts.push(attempt);save();const fb=$('#feedback-'+id);fb.className='feedback '+(correct?'good':'bad');fb.innerHTML=`<b>${correct?'정답입니다!':'오답입니다.'}</b><p>정답: ${esc(answerText(q))}</p><p>${esc(q.explain||'등록된 해설이 없습니다.')}</p><p class="small">이번 결과는 로컬 학습 기록에 저장되었습니다.</p>`;form.querySelectorAll('input,button').forEach(el=>el.disabled=true);renderNavOnly();}
function renderNavOnly(){nav()};window.submitAnswer=submitAnswer;
function showExplanation(id){const q=getQ(id),fb=$('#feedback-'+id);fb.className='feedback';fb.innerHTML=`<b>해설</b><p>정답: ${esc(answerText(q))}</p><p>${esc(q.explain||'등록된 해설이 없습니다.')}</p>`}window.showExplanation=showExplanation;
function toggleTheory(id){state.theory[id]??={checks:[],done:false};state.theory[id].done=!state.theory[id].done;save();render()}window.toggleTheory=toggleTheory;
function toggleLab(id,done){state.labs[id]??={};state.labs[id].done=done;save();render()}window.toggleLab=toggleLab;function saveLabNote(id,note){state.labs[id]??={};state.labs[id].note=note;save()}window.saveLabNote=saveLabNote;
function bookmark(id){const s=new Set(state.bookmarks);s.has(id)?s.delete(id):s.add(id);state.bookmarks=[...s];save();render()}window.bookmark=bookmark;
function deleteQuestion(id){if(!confirm('이 문항을 삭제할까요? 기존 제출 이력은 보존됩니다.'))return;state.questions=state.questions.filter(q=>q.id!==id);save();render()}window.deleteQuestion=deleteQuestion;
function resetAttempts(){if(!confirm('모든 문제 제출 이력을 삭제할까요? 이 작업은 되돌릴 수 없습니다. 먼저 백업 파일을 만들 수 있습니다.'))return;state.attempts=[];save();render()}window.resetAttempts=resetAttempts;
function openRepo(path=''){window.open('https://sumilee-phd.github.io/NA2-study/'+path,'_blank','noopener')}window.openRepo=openRepo;
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='na2-study-record-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}window.exportData=exportData;
function downloadTemplate(){const template=[{id:'custom-1',area:'필기',topic:'네트워크 기초',type:'선택형',q:'문제 내용',options:['선택지 A','선택지 B','선택지 C','선택지 D'],answer:0,explain:'정답 해설'},{id:'custom-2',area:'실기',topic:'IPv4 설정',type:'단답형',q:'답을 입력하는 문제',answerText:['허용 답안','alternate answer'],explain:'단답형 해설'}];const b=new Blob([JSON.stringify(template,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='na2-question-template.json';a.click();URL.revokeObjectURL(u)}window.downloadTemplate=downloadTemplate;
$('#exportBtn').onclick=exportData;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:d.questions;if(!Array.isArray(arr))throw Error('문항 배열을 찾을 수 없습니다.');let count=0;arr.forEach(raw=>{if(!raw||!raw.q||!['필기','실기'].includes(raw.area)||!raw.topic||!raw.type) return;const q={...raw,id:String(raw.id||'import-'+Date.now()+'-'+count)};if(state.questions.some(x=>x.id===q.id))q.id=q.id+'-'+Date.now()+'-'+count;if(q.type==='선택형'&&(!Array.isArray(q.options)||!Number.isInteger(q.answer)||q.answer<0||q.answer>=q.options.length))return;if(q.type==='단답형'&&!Array.isArray(q.answerText))return;state.questions.push(q);count++});save();render();alert(`${count}개 문항을 추가했습니다.`)}catch(err){alert('가져오기 실패: '+err.message)}e.target.value=''};
window.addEventListener('storage',e=>{if(e.key===KEY){alert('다른 탭에서 학습 기록이 변경되었습니다. 최신 기록을 확인하려면 페이지를 새로고침하세요.')}});
render();
</script></body></html>
